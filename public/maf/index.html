<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#edf2ef"><title>МАФ · 3D-модель</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif;color:#162b27;background:#edf2ef}body{display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;padding:15px clamp(16px,4vw,40px)}.eyebrow{font-size:11px;letter-spacing:.14em;font-weight:750;color:#56716b}.title{font-size:21px;font-weight:700;margin-top:3px}.badge{font-size:12px;color:#44695b}main{position:relative;flex:1;min-height:0;margin:0 10px;border-radius:22px;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#fafbf8,#d6e2d9)}canvas{display:block;width:100%;height:100%;touch-action:none}.hint{position:absolute;top:15px;left:15px;color:#34574e;font-size:13px;line-height:1.4;pointer-events:none}.hint strong{display:block}.status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;padding:13px 16px;border-radius:12px;text-align:center;font-size:14px}.status[hidden]{display:none}.buttons{position:absolute;bottom:13px;left:12px;right:12px;display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap}button{border:1px solid #bfcfc6;background:#fffffff2;color:#174a38;border-radius:13px;height:44px;padding:0 14px;font:650 13px system-ui;cursor:pointer}button.icon{font-size:22px;min-width:44px;padding:0}button.active{background:#205e4a;color:white}button:focus-visible{outline:3px solid #4d9278}footer{padding:12px 16px calc(12px + env(safe-area-inset-bottom));font-size:12px;color:#59716a}@media(max-width:400px){.badge{display:none}button{padding:0 10px}.buttons{gap:5px}}
</style>
<script type="importmap">{"imports":{"three":"./three/three.module.js","three/addons/":"./three/addons/"}}</script></head>
<body><header><div><div class="eyebrow">ШКОЛЬНЫЙ КРУГ</div><div class="title">МАФ · 3D-модель</div></div><span class="badge">Интерактивный просмотр</span></header>
<main id="stage"><div class="hint"><strong>Покрути модель</strong>Палец — вращение · два пальца — масштаб</div><div class="status" id="status" role="status">Загружаем модель…</div><div class="buttons"><button id="roof">Показать внутри</button><button class="icon" id="out" aria-label="Отдалить">−</button><button class="icon" id="in" aria-label="Приблизить">+</button><button id="reset">В начало</button></div></main><footer>Для просмотра интерьера нажми «Показать внутри»</footer>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const stage=document.getElementById('stage'),status=document.getElementById('status'),roofButton=document.getElementById('roof');let roofHidden=false,model;
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(40,1,.03,180);camera.position.set(-19,16,23);
const renderer=new THREE.WebGLRenderer({antialias:false,alpha:true,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.25));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;stage.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xf5fff8,0x8b8c80,2.3));const sun=new THREE.DirectionalLight(0xffedd3,2);sun.position.set(-8,15,10);scene.add(sun);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.1,0);controls.minDistance=.5;controls.maxDistance=55;controls.enableDamping=false;controls.screenSpacePanning=true;
function render(){renderer.render(scene,camera)}controls.addEventListener('change',render);
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);render()}window.addEventListener('resize',resize);resize();
new GLTFLoader().load('./maf-optimized.glb?v=2',g=>{model=g.scene;scene.add(model);status.hidden=true;render()},e=>{if(e.lengthComputable)status.textContent=`Загружаем модель… ${Math.round(e.loaded/e.total*100)}%`},()=>{status.textContent='Не удалось загрузить модель. Обнови страницу.'});
roofButton.addEventListener('click',()=>{if(!model)return;roofHidden=!roofHidden;model.traverse(o=>{if(o.name.startsWith('ROOF__'))o.visible=!roofHidden});roofButton.textContent=roofHidden?'Вернуть крышу':'Показать внутри';roofButton.classList.toggle('active',roofHidden);if(roofHidden){controls.target.set(0,1,0);camera.position.set(-1,14,6);controls.update()}render()});
function zoom(f){const v=camera.position.clone().sub(controls.target).multiplyScalar(f);v.clampLength(controls.minDistance,controls.maxDistance);camera.position.copy(controls.target).add(v);controls.update();render()}
document.getElementById('in').onclick=()=>zoom(.8);document.getElementById('out').onclick=()=>zoom(1.25);document.getElementById('reset').onclick=()=>{controls.target.set(0,1.1,0);camera.position.set(-19,16,23);controls.update();render()};
</script></body></html>
