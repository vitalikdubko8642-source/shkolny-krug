<!doctype html>
<html lang="ru">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#edf2ef"><title>Школьный круг · 3D-модель МАФа</title>
 <script type="module" src="./model-viewer.min.js"></script>
 <style>
 *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#162b27;background:#edf2ef}body{min-height:100svh;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px clamp(18px,4vw,42px)}.eyebrow{font-size:11px;letter-spacing:.14em;font-weight:750;color:#56716b}.title{font-size:clamp(19px,3vw,25px);font-weight:700;margin-top:3px;letter-spacing:-.035em}.badge{border:1px solid #c8d9d1;border-radius:30px;padding:8px 12px;white-space:nowrap;font-size:12px;font-weight:650;color:#44695b}.stage{position:relative;flex:1;min-height:390px;margin:0 14px;border-radius:25px;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#fafbf8 0%,#e2eae2 63%,#ccd9d0 100%)}model-viewer{width:100%;height:100%;position:absolute;inset:0;--poster-color:transparent;touch-action:none}model-viewer:focus-visible,button:focus-visible{outline:3px solid #2a7963;outline-offset:-4px}.tip{position:absolute;top:18px;left:18px;max-width:260px;font-size:13px;line-height:1.45;color:#34574e;pointer-events:none}.tip strong{display:block;color:#173d32;font-size:14px}.controls{position:absolute;right:14px;bottom:14px;display:flex;gap:7px;align-items:center;z-index:2}.controls button{background:rgba(255,255,255,.94);border:1px solid rgba(43,81,65,.13);color:#1c483b;height:44px;min-width:44px;border-radius:14px;font-size:22px;cursor:pointer;box-shadow:0 4px 18px #243d2c18}.controls .reset{font-size:13px;font-weight:650;padding:0 14px}.status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 16px;background:#ffffffee;border-radius:14px;font-size:14px;text-align:center;box-shadow:0 10px 30px #19332518;pointer-events:none}.status[hidden]{display:none}footer{padding:13px 20px calc(13px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:12px;color:#59716a}footer span:last-child{text-align:right}@media(max-width:600px){header{padding:14px 17px}.stage{margin:0 8px;min-height:65svh;border-radius:20px}.tip{top:14px;left:14px}.controls{right:10px;bottom:10px}footer{padding:12px 16px calc(12px + env(safe-area-inset-bottom))}}@media(max-width:330px){.badge{display:none}}
 </style>
</head>
<body>
 <header><div><div class="eyebrow">ШКОЛЬНЫЙ КРУГ</div><div class="title">МАФ · 3D-модель</div></div><div class="badge">Интерактивный просмотр</div></header>
 <main class="stage" aria-label="Интерактивная модель школьного пространства">
  <model-viewer id="model" src="./maf.glb" poster="./poster.webp" alt="Трёхмерная модель школьного павильона с террасой" camera-controls touch-action="none" shadow-intensity="0.5" exposure="1.1" camera-orbit="-35deg 65deg 32m" min-camera-orbit="auto 8deg 5m" max-camera-orbit="auto 89deg 65m" camera-target="0m 1.4m 0m" interaction-prompt="none" loading="eager"></model-viewer>
  <div class="tip"><strong>Покрути модель</strong>Один палец — вращение,<br>два пальца — масштаб.</div>
  <div id="status" class="status" role="status">Загружаем 3D-модель…</div>
  <div class="controls"><button id="out" aria-label="Отдалить">−</button><button id="in" aria-label="Приблизить">+</button><button id="reset" class="reset" aria-label="Вернуть исходный ракурс">В начало</button></div>
 </main>
 <footer><span>Концепция пространства для встречи</span><span>Модель можно рассмотреть со всех сторон</span></footer>
 <script>
 const m=document.getElementById('model'),status=document.getElementById('status');
 m.addEventListener('load',()=>status.hidden=true);m.addEventListener('error',()=>{status.textContent='Не удалось загрузить модель. Проверь подключение и обнови страницу.'});
 function zoom(f){const o=m.getCameraOrbit();m.cameraOrbit=`${o.theta}rad ${o.phi}rad ${o.radius*f}m`;m.jumpCameraToGoal()}
 document.getElementById('in').addEventListener('click',()=>zoom(.8));document.getElementById('out').addEventListener('click',()=>zoom(1.25));document.getElementById('reset').addEventListener('click',()=>{m.cameraOrbit='-35deg 65deg 32m';m.cameraTarget='0m 1.4m 0m';m.jumpCameraToGoal()});
 </script>
</body></html>
