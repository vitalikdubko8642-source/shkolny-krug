# Каждый раз, когда мы отправляем код на GitHub, этот сценарий сам собирает
# приложение и выкладывает его на GitHub Pages — получается публичная ссылка.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # Allow the Actions artifact API to finish indexing the uploaded archive.
      - name: Wait for Pages artifact
        run: sleep 10
      - id: deployment
        uses: actions/deploy-pages@v4
